services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: everylaw
      POSTGRES_PASSWORD: everylaw
      POSTGRES_DB: everylaw
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everylaw -d everylaw"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - everylaw_postgres:/var/lib/postgresql/data

volumes:
  everylaw_postgres:

