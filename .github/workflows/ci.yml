name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everylaw
          POSTGRES_PASSWORD: everylaw
          POSTGRES_DB: everylaw
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U everylaw -d everylaw"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://everylaw:everylaw@localhost:54329/everylaw
      VOTER_HASH_SECRET: ci-only-secret
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
